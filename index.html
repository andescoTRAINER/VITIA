<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Lizet · Plan de entrenamiento</title><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bur:#701C2B;--bg:#ffffff;--card:#f8f6f6;--tx:#3a3a3a;--mu:#8a8a88;--ln:#e3dcde}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16100f;--card:#211a1b;--tx:#ece7e8;--mu:#a09a9b;--ln:#3a2f31;--bur:#d4748a}}
:root[data-theme="dark"]{--bg:#16100f;--card:#211a1b;--tx:#ece7e8;--mu:#a09a9b;--ln:#3a2f31;--bur:#d4748a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:2px solid #701C2B}
header img{width:38px;height:auto}header b{letter-spacing:.12em;font-size:15px}header span{color:var(--mu);font-size:11px;letter-spacing:.1em}
.hero{background:#701C2B;color:#fff;text-align:center;padding:22px 18px}
.hero h1{margin:0;font-size:21px;letter-spacing:.03em}.hero p{margin:6px 0 0;color:#e5cbd0;font-size:13px}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.grp{margin:20px 0 8px;font-size:12px;letter-spacing:.2em;color:#fff;background:#9E9F9C;padding:7px 12px;border-radius:8px}
.card{position:relative;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px 14px;margin-bottom:16px;text-align:center}
.num{position:absolute;top:12px;left:12px;width:28px;height:28px;border-radius:50%;background:#701C2B;color:#fff;font-size:14px;font-weight:bold;display:flex;align-items:center;justify-content:center}
h2{margin:0 0 12px;font-size:16px;color:var(--bur);letter-spacing:.04em;padding:0 30px}
.gif{background:#fff;border-radius:12px;padding:6px;margin-bottom:8px;position:relative}.gif img{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.mov{position:absolute;top:10px;right:10px;background:#701C2B;color:#fff;font-size:10px;letter-spacing:.08em;padding:4px 8px;border-radius:20px}
.cap{font-size:11px;color:var(--mu);margin:-2px 0 8px}
.meta{margin:10px 0 8px;font-weight:bold;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-width:54px;padding:10px 12px;border-radius:10px;border:1.5px solid #701C2B;background:transparent;color:var(--tx);font-size:14px;font-weight:bold}
.chip.on{background:#701C2B;color:#fff}
.note{margin:12px 0 0;color:var(--bur);font-size:12px;font-weight:bold;line-height:1.45}
footer{text-align:center;color:var(--mu);font-size:11px;letter-spacing:.1em;padding:0 0 24px}

.day{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px 16px;margin-bottom:12px;text-decoration:none;color:var(--tx)}
.day b{color:var(--bur);font-size:17px;letter-spacing:.06em;min-width:70px}.day span{flex:1;font-size:13px;color:var(--mu)}.day i{font-style:normal;color:#fff;background:#701C2B;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:12px}
</style></head><body>
